databases:
  - name: kaamsetu-db
    plan: free
    databaseName: kaamsetu
    user: kaamsetu

services:
  - type: web
    name: kaamsetu-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn fixmitra.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/services/categories/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "False"
      - key: DEMO_MODE
        value: "True"
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "True"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kaamsetu-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Actual host today: kaamsetu-api-vtac.onrender.com (see frontend/vercel.json).
      # api.kaamsetu.app is optional future custom domain — only works after DNS + Render custom domain.
      - key: ALLOWED_HOSTS
        value: "kaamsetu-api-vtac.onrender.com,kaamsetu-api.onrender.com,.onrender.com"
      - key: FRONTEND_URL
        value: "https://kaamsetu.app"
      - key: PUBLIC_FRONTEND_URL
        value: "https://kaamsetu.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://kaamsetu.app,https://www.kaamsetu.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://kaamsetu.app,https://www.kaamsetu.app"
