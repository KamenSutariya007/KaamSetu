{% extends 'base.html' %}
{% load static %}

{% block title %}{{ t.forgotPassword }} — {{ t.appName }}{% endblock %}

{% block site_header %}{% endblock %}
{% block site_footer %}{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
  <div class="auth-mobile-card">

    <!-- Top Navigation Row with Circular Back Button -->
    <div class="auth-header-row">
      <a href="{% url 'login' %}" class="auth-circular-back" aria-label="Go back to login">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"></path>
        </svg>
      </a>
    </div>

    <!-- Screen Title & Subtitle -->
    <h1 class="auth-screen-title">{{ t.forgotPassword }}</h1>
    <p class="auth-screen-subtitle">{{ t.enterEmailToReset }}</p>

    <!-- Forgot Password Form -->
    <form method="POST" action="{% url 'forgot_password' %}" id="forgotForm">
      {% csrf_token %}

      <!-- Your Email Field -->
      <div class="auth-form-group">
        <label for="id_forgot_email" class="auth-form-label">{{ t.yourEmail }}</label>
        <div class="auth-input-wrapper">
          <input 
            type="email" 
            name="email" 
            id="id_forgot_email" 
            class="auth-input" 
            placeholder="{{ t.enterEmail }}" 
            value="{{ email|default:'' }}" 
            required 
            autofocus
            oninput="handleEmailInput(this)"
          >
        </div>
      </div>

      <!-- Reset Password Button -->
      <button type="submit" class="auth-btn-blue {% if not email %}is-disabled{% endif %}" id="btnResetPassword">
        <span>{{ t.resetPassword }}</span>
      </button>
    </form>

  </div>
</div>

<script>
  function handleEmailInput(input) {
    const btn = document.getElementById('btnResetPassword');
    if (!btn) return;
    if (input.value.trim().length > 3 && input.value.includes('@')) {
      btn.classList.remove('is-disabled');
      btn.removeAttribute('disabled');
    } else {
      btn.classList.add('is-disabled');
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    const emailField = document.getElementById('id_forgot_email');
    if (emailField && emailField.value.trim().length > 3) {
      handleEmailInput(emailField);
    }
  });
</script>
{% endblock %}
