{% extends 'base.html' %}
{% load static %}

{% block title %}Set New Password — {{ t.appName }}{% endblock %}

{% block content %}
<div style="background: linear-gradient(180deg, var(--color-brand-dark) 0%, #062321 100%); min-height: calc(100vh - 4.5rem); display: flex; align-items: center; justify-content: center; padding: 2.5rem 1.25rem;">
  <div style="max-width: 440px; width: 100%;">
    
    <div class="card" style="padding: 2rem; border-radius: var(--radius-xl); box-shadow: var(--shadow-xl);">
      <h2 style="font-size: 1.375rem; font-weight: 800; margin-bottom: 0.5rem;">Choose New Password</h2>
      <p style="color: var(--color-muted); font-size: 0.875rem; margin-bottom: 1.5rem;">
        Resetting password for: <strong>{{ email }}</strong>
      </p>

      <form method="POST" action="{% url 'reset_password' %}">
        {% csrf_token %}
        <input type="hidden" name="email" value="{{ email }}">

        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" name="password" class="form-input" placeholder="At least 8 characters" required>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <input type="password" name="password_confirm" class="form-input" placeholder="Repeat your new password" required>
        </div>

        <button type="submit" class="btn btn-coral btn-block btn-lg" style="margin-top: 1.25rem;">
          Update Password
        </button>
      </form>
    </div>

  </div>
</div>
{% endblock %}
