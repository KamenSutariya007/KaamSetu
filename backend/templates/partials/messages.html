{% if messages %}
<div class="messages-container" id="toastContainer">
  {% for message in messages %}
  <div class="toast toast-{{ message.tags|default:'info' }}">
    <div>{{ message }}</div>
    <button class="toast-close" onclick="this.parentElement.remove()" aria-label="Close">&times;</button>
  </div>
  {% endfor %}
</div>
{% endif %}
